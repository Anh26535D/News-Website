apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: be-image-hpa
  namespace: flask-be
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: be-image
  minReplicas: 3   # Số lượng pod tối thiểu
  maxReplicas: 10  # Số lượng pod tối đa
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # Scale up nếu CPU trung bình vượt quá 50% của request (250m)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50 # Scale up nếu Memory trung bình vượt quá 50% của request (512Mi)