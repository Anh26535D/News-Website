apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: be-image-hpa
  namespace: news-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: be-image
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50