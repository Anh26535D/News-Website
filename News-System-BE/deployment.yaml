apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-image
  namespace: news-system
spec:
  selector:
    matchLabels:
      app: be-image
  template:
    metadata:
      labels:
        app: be-image
    spec:
      containers:
      - name: be-image
        image: asia-southeast1-docker.pkg.dev/news-system-cloud-project/docker-repo/be-image:tag1
        imagePullPolicy: Always
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: be-config