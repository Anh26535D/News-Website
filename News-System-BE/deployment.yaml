apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-image
  namespace: flask-be
spec:
  selector:
    matchLabels:
      app: be-image
  template:
    metadata:
      labels:
        app: be-image
    spec:
      containers:
      - name: be-image
        image: asia-southeast1-docker.pkg.dev/crested-aquifer-485713-v5/docker-repo/be-image:tag1
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        ports:
        - containerPort: 3030
        envFrom:
        - configMapRef:
            name: be-config