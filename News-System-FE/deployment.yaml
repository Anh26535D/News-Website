apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-image
  namespace: news-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fe-image
  template:
    metadata:
      labels:
        app: fe-image
    spec:
      containers:
      - name: fe-image
        image: asia-southeast1-docker.pkg.dev/news-system-cloud-project/docker-repo/fe-image:tag1
        imagePullPolicy: Always
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: ssl-certs
          mountPath: "/etc/nginx/certs"
          readOnly: true
        - name: nginx-config
          mountPath: "/etc/nginx/conf.d/default.conf"
          subPath: nginx.conf
        envFrom:
        - configMapRef:
            name: fe-config
      volumes:
      - name: ssl-certs
        secret:
          secretName: fe-ssl-cert
      - name: nginx-config
        configMap:
          name: fe-nginx-config