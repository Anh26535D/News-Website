apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-image
  namespace: npm-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fe-image
  template:
    metadata:
      labels:
        app: fe-image
    spec:
      containers:
      - name: fe-image
        image: us-central1-docker.pkg.dev/news-system-cloud-project/docker-repo/fe-image:tag1
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        ports:
        - containerPort: 3300
        envFrom:
        - configMapRef:
            name: fe-config