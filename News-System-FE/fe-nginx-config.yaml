apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-nginx-config
  namespace: npm-fe
data:
  nginx.conf: |
    server {
        listen 8080 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Tối ưu SSL
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Bảo mật Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'self'; 
            script-src 'self' 'unsafe-inline' https://s3.tradingview.com; 
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://stackpath.bootstrapcdn.com; 
            font-src 'self' https://fonts.gstatic.com https://stackpath.bootstrapcdn.com; 
            img-src 'self' data: https:; 
            connect-src 'self' https://be-service.flask-be.svc.cluster.local:8000;
            frame-src 'self' https://www.tradingview-widget.com https://s.tradingview.com https://s3.tradingview.com;";
        add_header Referrer-Policy "no-referrer-when-downgrade";

        # --- CẤU HÌNH PROXY PASS ---
        location ~ ^/(news|track) {
            proxy_pass http://be-service.flask-be.svc.cluster.local:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location ~ /\. {
            deny all;
        }
    }