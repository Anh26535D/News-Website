apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: client
    - port: 9093
      targetPort: 9093
      name: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-client-lb
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
