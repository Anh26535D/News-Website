apiVersion: v1
kind: Service
metadata:
  labels:
    app: kafka-broker
  name: kafka-service
  namespace: news-system
spec:
  type: LoadBalancer
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka-port
  selector:
    app: kafka-broker

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kafka-broker
  name: kafka-broker
  namespace: news-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      hostname: kafka-broker
      containers:
      - name: kafka-broker
        image: wurstmeister/kafka
        imagePullPolicy: Always
        env:
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service.news-system.svc.cluster.local:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service.news-system.svc.cluster.local:9092"
        - name: KAFKA_BROKER_ID_COMMAND
          value: "hostname | awk -F'-' '{print $3}'"
        - name: KAFKA_ADVERTISED_HOST_NAME_COMMAND
          value: "hostname -f"
        - name: KAFKA_ADVERTISED_PORT
          value: "9092"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx512M -Xms512M"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        ports:
        - containerPort: 9092