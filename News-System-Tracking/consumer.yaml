apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: news-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: asia-southeast1-docker.pkg.dev/news-system-cloud-project/docker-repo/consumer:tag1
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: consumer-config